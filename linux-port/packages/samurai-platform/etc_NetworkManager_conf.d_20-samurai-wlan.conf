[device-samurai-wlan]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[connection-samurai-wlan]
match-device=interface-name:wlan0
wifi.cloned-mac-address=preserve
# ath10k_snoc on this board adds per-packet latency and loss in 5 GHz while
# the firmware power-save / U-APSD path is active.  Measured on 2026-11-20
# with the fixed regulatory domain: power save on -> 0-85 % ping loss,
# power save off -> 0-3 %.  2 = disable, which is the same value
# `nmcli con mod <con> wifi.powersave 2` stores; it is a stock
# NetworkManager setting, not a board-private knob.
wifi.powersave=2
