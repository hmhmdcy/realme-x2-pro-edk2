# WirePlumber names every libcamera node with location=back
# "Built-in Back Camera".  On the Realme X2 Pro that makes the three rear
# sensors indistinguishable in application camera selectors.
monitor.libcamera.rules = [
  {
    matches = [
      { device.product.name = "s5kgw1" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Back Camera (Main)"
        node.nick = "S5KGW1"
        priority.session = 900
      }
    }
  }
  {
    matches = [
      { device.product.name = "imx319" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Back Camera (Ultra Wide)"
        node.nick = "IMX319"
      }
    }
  }
  {
    matches = [
      { device.product.name = "s5k3m5" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Back Camera (Telephoto)"
        node.nick = "S5K3M5"
      }
    }
  }
]
