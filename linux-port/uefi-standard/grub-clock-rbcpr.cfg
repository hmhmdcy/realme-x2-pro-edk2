set timeout=0
set timeout_style=hidden

insmod part_gpt
insmod part_msdos
insmod fat
insmod search
insmod search_fs_file
insmod linux
insmod fdt
insmod sleep
insmod test
insmod echo
insmod boot

search --no-floppy --file --set=root /Image
if [ -z "$root" ]; then
  echo "samurai: FAT containing /Image not found"
  sleep 10
  exit
fi

if [ ! -f /Image ]; then
  echo "samurai: /Image not found"
  sleep 10
  exit
fi

if [ ! -f /samurai.dtb ]; then
  echo "samurai: /samurai.dtb not found"
  sleep 10
  exit
fi

echo "samurai: clock RBCPR candidate, safety flag removed"
linux /Image console=tty0 loglevel=4 panic=15 root=PARTLABEL=userdata rootfstype=f2fs rootwait rw
devicetree /samurai.dtb
boot
