SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='CDC_IF TX1 MUX' ZERO"
		cset "name='AMIC MUX1' ZERO"
		cset "name='DMIC MUX5' DMIC0"
		cset "name='ADC MUX5' DMIC"
		cset "name='CDC_IF TX5 MUX' DEC5"
		cset "name='AIF1_CAP Mixer SLIM TX5' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='AIF1_CAP Mixer SLIM TX5' 0"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 INTERP' ZERO"
		cset "name='RX INT2_1 INTERP' ZERO"
		cset "name='COMP1 Switch' 0"
		cset "name='COMP2 Switch' 0"
		cset "name='CDC_IF TX1 MUX' ZERO"
		cset "name='CDC_IF TX5 MUX' ZERO"
		cset "name='AMIC MUX1' ZERO"
		cset "name='DMIC MUX5' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Stereo speakers"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "3.5 mm headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_1 MIX1 INP0' RX0"
		cset "name='RX INT2_1 MIX1 INP0' RX1"
		cset "name='RX INT1_1 INTERP' 'RX INT1_1 MIX1'"
		cset "name='RX INT2_1 INTERP' 'RX INT2_1 MIX1'"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='COMP1 Switch' 1"
		cset "name='COMP2 Switch' 1"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
		cset "name='COMP1 Switch' 0"
		cset "name='COMP2 Switch' 0"
		cset "name='RX INT1_1 INTERP' ZERO"
		cset "name='RX INT2_1 INTERP' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT2 DEM MUX' NORMAL_DSM_OUT"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		JackCTL "hw:${CardId}"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Primary digital microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
		cset "name='CDC_IF TX1 MUX' ZERO"
		cset "name='AMIC MUX1' ZERO"
		cset "name='DMIC MUX5' DMIC0"
		cset "name='ADC MUX5' DMIC"
		cset "name='CDC_IF TX5 MUX' DEC5"
		cset "name='AIF1_CAP Mixer SLIM TX5' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX5' 0"
		cset "name='CDC_IF TX5 MUX' ZERO"
		cset "name='DMIC MUX5' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureRate 48000
	}
}

SectionDevice."Headset" {
